name: Importar acervo Freud para a biblioteca
on:
  push:
    paths: ['.github/workflows/importar-biblioteca-freud.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transferir edições diagramadas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p biblioteca/pdfs
          while read -r volume endereco; do
            arquivo="biblioteca/pdfs/Freud_Volume_${volume}_Atelie_Leitura_Celular.pdf"
            curl --fail --location --silent --show-error --retry 4 --connect-timeout 30 --max-time 150 "$endereco" --output "$arquivo"
            test "$(head -c 5 "$arquivo")" = "%PDF-" || { echo "Arquivo inválido: $arquivo"; exit 1; }
            test "$(wc -c < "$arquivo")" -gt 100000 || { echo "Arquivo muito pequeno: $arquivo"; exit 1; }
            echo "${volume}: $(wc -c < "$arquivo") bytes"
          done <<'LISTA'
          I https://at.adobe.com/QHd3eeltnzs1jVcA
          II https://at.adobe.com/FIdxpXiT9DQGfXNd
          III https://at.adobe.com/kK62ehad9RAN71Wa
          IV https://at.adobe.com/ixPHxIiZtLnALwSz
          V https://at.adobe.com/RWS4MuPW4l49ysi0
          VI https://at.adobe.com/vnkb3WuSplXjkDVE
          VII https://at.adobe.com/ZCOf2DUPWk35AOUy
          VIII https://at.adobe.com/EZAU3FO6QUavj8it
          IX https://at.adobe.com/2dDPBwaaUMXp4qL4
          X https://at.adobe.com/JfoQB1N1wNEE8syC
          XI https://at.adobe.com/8VIKHenFwRZqpUqC
          XII https://at.adobe.com/JzR2lNGKB23mGZIx
          XIII https://at.adobe.com/toJEtd5dwdHXs6Bp
          XIV https://at.adobe.com/F07AppFFmIYvvvO6
          XV https://at.adobe.com/tkzje1JXx08ia4Oc
          XVI https://at.adobe.com/i1wbwvr8pBRx9tru
          XVII https://at.adobe.com/88VJ3tro30TPcZjs
          XVIII https://at.adobe.com/KJWjfDSH2yG7Mtvi
          XIX https://at.adobe.com/DQ5H8Pwklo9qcUwJ
          XX https://at.adobe.com/aWK72OG3farKYRvA
          XXI https://at.adobe.com/Zzq9ipqJP1I4D8mu
          XXII https://at.adobe.com/MQcHmbOUeJfYcBNb
          XXIII https://at.adobe.com/yeO7PLb0iqr8SS29
          LISTA
      - name: Publicar PDFs no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biblioteca/pdfs/
          git commit -m "Biblioteca: adicionar 23 volumes diagramados de Freud" || exit 0
          git push origin HEAD:main
