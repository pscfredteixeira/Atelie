<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f1">
  <meta name="description" content="Atelier — plataforma em desenvolvimento para aprender e ensinar psicanálise. Protótipo beta em JSON com editor visual, atividades e progresso local.">
  <title>Atelier. · Laboratório de Psicanálise</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23fff8f1'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia' font-size='46' fill='%23fa5d00'%3E%CF%88%3C/text%3E%3C/svg%3E">
  <script>
    // Evita piscar a página no tema errado antes de carregar o aplicativo.
    try {
      const stored = localStorage.getItem("atelier-theme-golden-v1");
      document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
    } catch {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/atelier.css?build=tema-claro-escuro-20261015-v1">
  <link rel="stylesheet" href="./src/styles/theme.css?build=quiz-feedback-verde-20261015-v1">
  <link rel="stylesheet" href="./src/styles/atelier-golden.css?build=golden-20261019-v1">
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <div id="app">
    <main class="main" id="main-content" tabindex="-1">
      <p class="overline">Atelier · Carregando</p>
      <h1 class="page-title">Preparando sua experiência.</h1>
      <p class="lead">Se esta mensagem permanecer, confira a conexão e a disponibilidade dos arquivos JavaScript.</p>
    </main>
  </div>
  <div class="toast-zone" id="toast-host" aria-live="polite" role="status"></div>
  <noscript><p style="padding:24px;color:#f5f0ef;background:#121218">O Atelier precisa de JavaScript para exibir seus ambientes demonstrativos.</p></noscript>
  <script type="module">
    // Inicialização com diagnóstico visível: um erro de importação não deve
    // deixar a plataforma eternamente na tela "Preparando sua experiência".
    const app = document.getElementById("app");
    function bootError(error) {
      console.error("Atelier: erro ao inicializar", error);
      app.replaceChildren();
      const main = document.createElement("main");
      main.className = "main";
      main.id = "main-content";
      const eyebrow = document.createElement("p");
      eyebrow.className = "overline";
      eyebrow.textContent = "Atelier · Inicialização";
      const title = document.createElement("h1");
      title.className = "page-title";
      title.textContent = "Não foi possível iniciar o Atelier.";
      const explanation = document.createElement("p");
      explanation.className = "lead";
      explanation.textContent = "Um arquivo do aplicativo não foi carregado. Atualize a página para tentar novamente. Seus cursos e rascunhos locais não serão apagados.";
      const detail = document.createElement("p");
      detail.className = "tiny";
      detail.textContent = "Detalhe técnico: " + (error?.message || String(error));
      const retry = document.createElement("button");
      retry.className = "button action";
      retry.type = "button";
      retry.textContent = "Atualizar e tentar novamente";
      retry.addEventListener("click", () => location.reload());
      main.append(eyebrow, title, explanation, detail, retry);
      app.append(main);
    }
    import("./src/app/main.js?build=golden-20261019-v1").catch(bootError);
  </script>
</body>
</html>
